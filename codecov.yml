# Codecov is here to report, not to gate. Both statuses are informational, so a
# PR that dips coverage gets a number rather than a red check — the test job is
# what decides whether a change is mergeable.
#
# `backend/app/db/migrations/**` and `strava_bridge/main.py` are already absent
# from coverage.xml (see `[tool.coverage.run] omit` in pyproject.toml), so they
# need no `ignore` entry here.
coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        informational: true
