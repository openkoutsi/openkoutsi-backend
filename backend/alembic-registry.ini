[alembic]
script_location = backend/app/db/migrations/registry
prepend_sys_path = .
# Alembic 1.16 deprecated the legacy space/comma/colon splitting of the
# path above. Stating the separator explicitly keeps the single-entry
# value unambiguous and stops the deprecation warning, which is now
# reached once per new user database rather than once per deploy.
path_separator = os
sqlalchemy.url = sqlite+aiosqlite:///data/registry.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
