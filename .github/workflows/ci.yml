name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version pin: "0.6.x" stopped resolving on 2026-08-17 ("No version
      # found for 0.6.x"), which turned every job red before it installed
      # anything — main included. The pin bought little, since uv.lock is what
      # actually fixes the dependency set and `uv sync --frozen` in the
      # Dockerfile enforces it; the image build already tracks uv:latest, so
      # this only brings CI in line with it.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ --cov=backend --cov-report=xml --cov-report=term-missing -v
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-production-aaaaaaaaaaaaa"
          # Required since #102 F-08 — an empty key no longer silently disables
          # field encryption. A throwaway Fernet key, so CI runs the encrypted
          # column path rather than the plaintext fallback.
          ENCRYPTION_KEY: "0xQFqFc2TsglXsh-2Nn0DAclf8Gn6VgGJm1gpMJ53cw="
          # Required since #102 F-10 — the bridges no longer start on "changeme".
          BRIDGE_SECRET: "ci-test-strava-bridge-secret-not-for-production"
          WAHOO_BRIDGE_SECRET: "ci-test-wahoo-bridge-secret-not-for-production"
          # Measure coverage with sys.monitoring (Python 3.12+) instead of the
          # default C trace function. Same lines, a fraction of the cost: on a
          # three-module slice the tracer took the run from 33s to 59s, where
          # sysmon takes it to 35s. The reported total moves by about a point —
          # upwards, since sysmon sees a few lines the tracer misses — so this
          # cannot quietly hide uncovered code.
          COVERAGE_CORE: sysmon

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore
