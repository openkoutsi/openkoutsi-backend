name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # No version pin: "0.6.x" stopped resolving on 2026-08-17 and turned every
      # job red before it installed anything. uv.lock is what fixes the
      # dependency set, and the image build already tracks uv:latest.
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ --cov=backend --cov-report=xml --cov-report=term-missing -v
        env:
          SECRET_KEY: "ci-test-secret-key-not-used-in-production-aaaaaaaaaaaaa"
          # Required since #102 F-08. A throwaway Fernet key, so CI runs the
          # encrypted column path rather than the plaintext fallback.
          ENCRYPTION_KEY: "0xQFqFc2TsglXsh-2Nn0DAclf8Gn6VgGJm1gpMJ53cw="
          # Required since #102 F-10 — the bridges no longer start on "changeme".
          BRIDGE_SECRET: "ci-test-strava-bridge-secret-not-for-production"
          WAHOO_BRIDGE_SECRET: "ci-test-wahoo-bridge-secret-not-for-production"
          # Coverage via sys.monitoring (Python 3.12+) rather than the default C
          # trace function: same lines, a fraction of the cost (33s → 35s where
          # the tracer takes 59s), and the total moves *up* by about a point,
          # since sysmon sees lines the tracer misses.
          COVERAGE_CORE: sysmon

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

      # Feeds the README badge and the per-file report. Deliberately not
      # `fail_ci_if_error`: a Codecov outage, or a fork PR that cannot read the
      # secret, must not turn a green test run red.
      - name: Send coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
