[project]
name = "openkoutsi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fitdecode>=0.11.0",
    "fastapi[standard]",
    "numpy>=2.0",
    "sqlalchemy[asyncio]>=2.0",
    "alembic",
    "aiosqlite",
    "python-jose[cryptography]",
    "bcrypt>=5",
    "python-multipart",
    "httpx>=0.27",
    "pydantic-settings",
    "email-validator",
    "slowapi",
    "cryptography",
    "fit-tool>=0.9",
    "lettermint>=2.1.0",
    "euromail>=0.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `replica_unsafe` marks a test whose subject holds state in *this process* —
# an in-memory counter, a module-global dict, a `lifespan` task with no leader
# election — so the test is only true while exactly one process runs. These are
# not failing or flaky tests; they are the inventory of what a second replica
# would break, kept findable rather than discovered by failure (issue #50).
# List them with: uv run python -m pytest -m replica_unsafe --collect-only -q
markers = [
    "replica_unsafe: encodes a single-process assumption; revisit before running a second replica",
]

[tool.coverage.run]
omit = [
    "backend/app/db/migrations/env.py",
    "backend/app/db/migrations/registry/env.py",
    "backend/app/db/migrations/team/env.py",
    "strava_bridge/main.py",
]
